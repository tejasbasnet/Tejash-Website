<!doctype html>
<html>
    <head>
        <title> Tejash webpage</title>
        <link rel="stylesheet" href="global.css" />
        <style>
            body {
                font-family: Arial, sans-serif;
                background: #f5f7fb;
                color: #333;
                margin: 0;
                padding: 0;
            }

            nav {
                background: #ffffff;
                padding: 14px 20px;
                text-align: center;
                box-shadow: 0 1px 4px rgba(0, 0, 0, 0.08);
            }

            nav a {
                color: #333333;
                text-decoration: none;
                margin: 0 10px;
                font-weight: 600;
            }

            nav a:hover {
                color: #007acc;
            }

            main {
                display: flex;
                justify-content: center;
                align-items: center;
                min-height: calc(100vh - 68px);
                padding: 40px 20px;
            }

            .contact-card {
                width: 100%;
                max-width: 520px;
                background: #ffffff;
                padding: 32px;
                border-radius: 18px;
                box-shadow: 0 20px 40px rgba(0, 0, 0, 0.08);
            }

            .contact-card h1 {
                margin-top: 0;
                color: #111111;
            }

            .contact-card p {
                color: #555555;
                line-height: 1.7;
                margin-bottom: 24px;
            }

            form {
                display: grid;
                gap: 16px;
            }

            label {
                font-weight: 600;
            }

            input,
            textarea {
                width: 100%;
                padding: 14px 16px;
                border: 1px solid #d6dcdf;
                border-radius: 12px;
                background: #f9fcff;
                font: inherit;
                color: #2c3e50;
            }

            textarea {
                min-height: 140px;
                resize: vertical;
            }

            button {
                background: #007acc;
                color: #ffffff;
                border: none;
                padding: 14px 18px;
                border-radius: 12px;
                cursor: pointer;
                font-weight: 700;
                transition: background 0.2s ease;
            }

            button:hover {
                background: #005fa3;
            }
        </style>
    </head>
    <body>
        <nav>
            <a href="index.html">Home</a> |
            <a href="about.html">About</a> |
            <a href="contact.html">Contact</a>
        </nav>
        <main>
            <section class="contact-card">
                <h1>Contact Me</h1>
                <p>If you have questions or want to work together, send a message below.</p>
                <form action="#" method="post">
                    <label for="name">Name</label>
                    <input type="text" id="name" name="name" placeholder="Your name" required />

                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="your@example.com" required />

                    <label for="subject">Subject</label>
                    <input type="text" id="subject" name="subject" placeholder="Subject" />

                    <label for="message">Message</label>
                    <textarea id="message" name="message" placeholder="Write your message here..." required></textarea>

                    <button type="submit">Send Message</button>
                </form>
            </section>
        </main>
    </body>
</html>
